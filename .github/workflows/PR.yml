name: Build PR

on:
  pull_request:
    paths-ignore:
      - 'README.md'
    branches:
      - 'master'

env:
  OPAMCONFIRMLEVEL: unsafe-yes
  GT_WITH_DOCS: yes
  OPAMROOT: /home/opam/.opam

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        containers: [ 'zanuda414' ]

    runs-on: ubuntu-latest
    container:
      image: kakadu18/ocaml:${{ matrix.containers }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.containers }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - run: opam --version

      - run: opam update
      - run: |
          sudo apt-get update
          sudo apt-get install pkg-config libpcre2-dev m4 xdot --no-install-recommends -y

      #- run: opam pin add ppx_optcomp_nobase https://github.com/Kakadu/ppx_optcomp_nobase.git\#nobase --no-action
      - run: opam pin add bisect_ppx https://github.com/Kakadu/bisect_ppx_ng.git\#Hacking4.14 --no-action

      - run: opam install . --deps-only --with-test --with-doc
      - run: opam exec -- dune build @check --profile=release
      - run: opam exec -- dune test --profile=release

      - name: Installing using Opam
        run: opam pin add GT ./

      - name: List files
        run: opam show --list-files GT


      - run: opam exec -- make coverage
      # TODO: coverage
